<svg viewBox="0 0 816 336" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="816" height="336" fill="#ffffff"/>

  <text x="408.0" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Load factor under alternating put/remove</text>

  <!-- Panel A: no hysteresis -->
  <text x="216.0" y="42" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">Without hysteresis (single threshold = 0.5)</text>

  <rect x="46" y="56" width="340" height="210" fill="none" stroke="#d1d5db" stroke-width="1"/>
  <!-- gridlines at 0, .25, .5, .75, 1 -->
  <line x1="46" y1="266.0" x2="386" y2="266.0" stroke="#f3f4f6" stroke-width="1"/><line x1="46" y1="213.5" x2="386" y2="213.5" stroke="#f3f4f6" stroke-width="1"/><line x1="46" y1="161.0" x2="386" y2="161.0" stroke="#f3f4f6" stroke-width="1"/><line x1="46" y1="108.5" x2="386" y2="108.5" stroke="#f3f4f6" stroke-width="1"/><line x1="46" y1="56.0" x2="386" y2="56.0" stroke="#f3f4f6" stroke-width="1"/>
  <text x="38" y="270.0" text-anchor="end" font-size="10" fill="#9ca3af">0.00</text><text x="38" y="217.5" text-anchor="end" font-size="10" fill="#9ca3af">0.25</text><text x="38" y="165.0" text-anchor="end" font-size="10" fill="#9ca3af">0.50</text><text x="38" y="112.5" text-anchor="end" font-size="10" fill="#9ca3af">0.75</text><text x="38" y="60.0" text-anchor="end" font-size="10" fill="#9ca3af">1.00</text>

  <!-- mirrored threshold line -->
  <line x1="46" y1="161.0" x2="386" y2="161.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="382" y="155.0" text-anchor="end" font-size="10.5" fill="#dc2626">grow / shrink at 0.5</text>

  <polyline points="46.0,161.0 88.5,212.4 131.0,161.0 173.5,212.4 216.0,161.0 258.5,212.4 301.0,161.0 343.5,212.4 386.0,161.0" fill="none" stroke="#9ca3af" stroke-width="1.75"/>
  <circle cx="46.0" cy="161.0" r="3" fill="#6b7280" stroke="white" stroke-width="1"/>
    <circle cx="88.5" cy="212.4" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="131.0" cy="161.0" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="173.5" cy="212.4" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="216.0" cy="161.0" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="258.5" cy="212.4" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="301.0" cy="161.0" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="343.5" cy="212.4" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>
    <circle cx="386.0" cy="161.0" r="4.5" fill="#dc2626" stroke="white" stroke-width="1"/>

  <text x="216.0" y="290" text-anchor="middle" font-size="11" fill="#6b7280">operation #  (put, remove, put, remove, …)</text>
  <text x="216.0" y="306" text-anchor="middle" font-size="10.5" fill="#dc2626">● every single operation triggers a full resize, forever</text>

  <!-- Panel B: hysteresis -->
  <text x="616.0" y="42" text-anchor="middle" font-size="13.5" font-weight="600" fill="#111827">With hysteresis (grow 0.75 / shrink 0.25)</text>

  <rect x="446" y="56" width="340" height="210" fill="none" stroke="#d1d5db" stroke-width="1"/>
  <line x1="446" y1="266.0" x2="786" y2="266.0" stroke="#f3f4f6" stroke-width="1"/><line x1="446" y1="213.5" x2="786" y2="213.5" stroke="#f3f4f6" stroke-width="1"/><line x1="446" y1="161.0" x2="786" y2="161.0" stroke="#f3f4f6" stroke-width="1"/><line x1="446" y1="108.5" x2="786" y2="108.5" stroke="#f3f4f6" stroke-width="1"/><line x1="446" y1="56.0" x2="786" y2="56.0" stroke="#f3f4f6" stroke-width="1"/>
  <text x="438" y="270.0" text-anchor="end" font-size="10" fill="#9ca3af">0.00</text><text x="438" y="217.5" text-anchor="end" font-size="10" fill="#9ca3af">0.25</text><text x="438" y="165.0" text-anchor="end" font-size="10" fill="#9ca3af">0.50</text><text x="438" y="112.5" text-anchor="end" font-size="10" fill="#9ca3af">0.75</text><text x="438" y="60.0" text-anchor="end" font-size="10" fill="#9ca3af">1.00</text>

  <!-- stable band -->
  <rect x="446" y="108.5" width="340" height="105.0" fill="#ecfdf5"/>

  <line x1="446" y1="108.5" x2="786" y2="108.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="782" y="102.5" text-anchor="end" font-size="10.5" fill="#059669">grow at 0.75</text>

  <line x1="446" y1="213.5" x2="786" y2="213.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="782" y="227.5" text-anchor="end" font-size="10.5" fill="#059669">shrink at 0.25</text>

  <polyline points="446.0,161.0 488.5,158.9 531.0,161.0 573.5,158.9 616.0,161.0 658.5,158.9 701.0,161.0 743.5,158.9 786.0,161.0" fill="none" stroke="#374151" stroke-width="1.75"/>
  <circle cx="446.0" cy="161.0" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="488.5" cy="158.9" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="531.0" cy="161.0" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="573.5" cy="158.9" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="616.0" cy="161.0" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="658.5" cy="158.9" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="701.0" cy="161.0" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="743.5" cy="158.9" r="3" fill="#374151" stroke="white" stroke-width="1"/>
    <circle cx="786.0" cy="161.0" r="3" fill="#374151" stroke="white" stroke-width="1"/>

  <text x="616.0" y="290" text-anchor="middle" font-size="11" fill="#6b7280">operation #  (put, remove, put, remove, …)</text>
  <text x="616.0" y="306" text-anchor="middle" font-size="10.5" fill="#059669">● same operations, load factor stays in the band — no resize at all</text>
</svg>